name: Vinted watch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Sprawdz Vinted i wyslij powiadomienia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vinted_watch.py

      - name: Zapisz nowe ID ofert w repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'update seen items'
          file_pattern: 'data/seen_items.json'
